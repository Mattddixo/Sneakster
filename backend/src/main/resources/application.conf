ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.mattdixon.snakeapi.ApplicationKt.module ]
    }
}

database {
    jdbcUrl = "jdbc:postgresql://localhost:5432/sneakster"
    jdbcUrl = ${?DATABASE_JDBC_URL}
    user = "sneakster"
    user = ${?DATABASE_USER}
    password = "sneakster"
    password = ${?DATABASE_PASSWORD}
}

cors {
    # Comma-separated list of allowed origins, e.g. "https://sneakster.example.ts.net"
    allowedHosts = ""
    allowedHosts = ${?ALLOWED_ORIGINS}
}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sneakster
      POSTGRES_USER: sneakster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - sneakster-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sneakster -d sneakster"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/sneakster
      DATABASE_USER: sneakster
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Comma-separated origins if you ever front this with a browser client; the Android
      # app doesn't send an Origin header so this can stay empty for a phone-only setup.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    ports:
      # Host port defaults to 8081 (override with HOST_PORT in .env); the container always
      # listens on 8080 internally. Bind to the tailnet/loopback only — Tailscale's own
      # interface, not 0.0.0.0 — if this host is reachable from anywhere else, e.g.
      # "100.x.x.x:${HOST_PORT:-8081}:8080" using your Tailscale IP.
      - "${HOST_PORT:-8081}:8080"

volumes:
  sneakster-postgres-data:
